# This port is bound to VPS loopback by docker-compose.vps.yml. Cloudflared on
# the same host is the only public entry point and supplies CF-Connecting-IP.
map $http_cf_connecting_ip $gradeflow_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-GradeFlow-Client-IP $gradeflow_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS terminates at Cloudflare. Django uses this header for secure URLs,
        # cookies and redirect handling.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }
}
