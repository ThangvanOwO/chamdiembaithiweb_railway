# GradeFlow on a small VPS behind Cloudflare Tunnel.
# Run every command with: docker compose --env-file .env.vps -f docker-compose.vps.yml ...
name: gradeflow-vps

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${GRADEFLOW_ENV_FILE:-.env.vps}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${GRADEFLOW_ENV_FILE:-.env.vps}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: "False"
      PORT: "8000"
      TRUST_PROXY_CLIENT_IP: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput --verbosity 0 &&
        exec gunicorn chamdiemtudong.wsgi:application
        --bind 0.0.0.0:8000
        --workers 1 --threads 2 --timeout 300
        --access-logfile - --error-logfile -
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/ads.txt', headers={'Host':'gradeflow.io.vn','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - type: bind
        source: ./docker/nginx.vps.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--header=Host: gradeflow.io.vn", "http://127.0.0.1/ads.txt"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  media:
  static:
