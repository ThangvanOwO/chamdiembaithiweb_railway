# Docker Desktop on this PC. Keep the existing SQLite and uploaded files.
# The Cloudflare Tunnel service on Windows connects to 127.0.0.1:8000.
name: gradeflow-local

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker.local
    environment:
      PORT: "8000"
      TRUST_PROXY_CLIENT_IP: "1"
      GOOGLE_APPLICATION_CREDENTIALS: /run/gradeflow-secrets/firebase-admin.json
      FIREBASE_PROJECT_ID: gradeflow-19d58
    volumes:
      - ./.secrets:/run/gradeflow-secrets:ro
      - type: bind
        source: ./db.sqlite3
        target: /app/db.sqlite3
      - type: bind
        source: ./media
        target: /app/media
    expose:
      - "8000"
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py setup_google_oauth &&
        python manage.py collectstatic --noinput --verbosity 0 &&
        exec gunicorn chamdiemtudong.wsgi:application
        --bind 0.0.0.0:8000
        --workers 1 --threads 1 --timeout 300
        --access-logfile - --error-logfile -
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ads.txt', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  notifications:
    image: gradeflow-local-web
    restart: unless-stopped
    env_file:
      - .env.docker.local
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/gradeflow-secrets/firebase-admin.json
      FIREBASE_PROJECT_ID: gradeflow-19d58
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./.secrets:/run/gradeflow-secrets:ro
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "manage.py", "send_announcements", "--watch"]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - type: bind
        source: ./docker/nginx.local.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
