{% extends 'base.html' %}
{% block title %}Quên mật khẩu{% endblock %}
{% block content %}
<div class="card" style="max-width:540px; margin:32px auto; padding:24px;">
<h1>Đặt lại mật khẩu</h1><p>Nhập email đã đăng ký để nhận liên kết đặt lại mật khẩu.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Gửi liên kết</button></form>
<p><a href="{% url 'accounts:login' %}">Quay lại đăng nhập</a></p>
</div>
{% endblock %}
